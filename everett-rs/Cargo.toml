[package]
name = "everett"
version = "1.4.0"
edition = "2021"
description = "One layer above all your coding-agent sessions"
license = "MIT"

[[bin]]
name = "everett"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", features = ["json"] }
toml = "0.8"
fs2 = "0.4"
tempfile = "3"
wait-timeout = "0.2"
libc = "0.2"
rpassword = "7"
terminal_size = "0.4"

ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
assert_cmd = "2"
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
expectrl = "0.7"
vt100 = "0.15"

[profile.release]
lto = true
strip = true
