[package]
name = "everett"
version = "1.6.0"
edition = "2021"
description = "One layer above all your coding-agent sessions"
license = "MIT"

[[bin]]
name = "everett"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", features = ["json"] }
toml = "0.8"
fs2 = "0.4"
tempfile = "3"
wait-timeout = "0.2"
libc = "0.2"
rpassword = "7"
terminal_size = "0.4"
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "sync", "io-util", "io-std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
sha2 = "0.10"
subtle = "2"
url = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
httparse = "1"
convex = { version = "=0.10.4", path = "vendor/convex", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures = "0.3"
ssh-key = { version = "0.6", features = ["ed25519"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
anyhow = "1"

ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
assert_cmd = "2"
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
expectrl = "0.7"
vt100 = "0.15"
convex_sync_types = "=0.10.4"

[[test]]
name = "gateway_native"
harness = false

[[test]]
name = "peer_native"
harness = false

[profile.release]
lto = true
strip = true
