name: Rust binary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: Build and qualify all native release archives without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: everett-rs
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Verify installed portable plugin against the runtime
        working-directory: .
        env:
          EVERETT_VERIFY_BINARY: ${{ github.workspace }}/everett-rs/target/debug/everett
        run: python3 -m unittest discover -s plugins/everett-local/tests -v

  fixture-isolation:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/everett-rs/target
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fixtures ignore an exported DEVIN_HOME
        run: scripts/check-fixture-isolation.py
      - name: The same check fails at the commit before #230 was fixed
        run: scripts/check-fixture-isolation.py --known-bad ebb13b2

  dispatch-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The dispatch model passes and catches each historical mistake
        run: scripts/check-dispatch-model.py

  relay:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_artifacts == true
    uses: ./.github/workflows/cloudflare.yml

  build:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_artifacts == true
    needs: [test, relay]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' everett-rs/Cargo.toml | head -1)"
          test "v$crate" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != crate v$crate"; exit 1; }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - working-directory: everett-rs
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="everett-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "everett-rs/target/${{ matrix.target }}/release/everett" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Qualify the extracted native release archive
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          host_arch="$(rustc -vV | sed -n 's/^host: //p' | cut -d- -f1)"
          [[ "$RELEASE_TARGET" == "$host_arch-"* ]] || { echo "native artifact runner required" >&2; exit 1; }
          (cd dist && shasum -a 256 -c "everett-$RELEASE_TARGET.tar.gz.sha256")
          unpacked="$RUNNER_TEMP/everett-package-$RELEASE_TARGET"
          mkdir -p "$unpacked"
          tar -xzf "dist/everett-$RELEASE_TARGET.tar.gz" -C "$unpacked"
          binary="$unpacked/everett-$RELEASE_TARGET/everett"
          "$binary" --version > "$unpacked/version.txt"
          grep -Fx "revision: $GITHUB_SHA" "$unpacked/version.txt"
          grep -Fx "dirty: false" "$unpacked/version.txt"
          python3 -m unittest discover -s scripts -p test_install.py -v
          cd everett-rs
          EVERETT_VERIFY_BINARY="$binary" cargo test --locked --test release_journey --test gateway_native --test tunnel
      - uses: actions/upload-artifact@v7
        with:
          name: everett-${{ matrix.target }}
          path: dist/everett-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Render the Homebrew formula
        run: scripts/render_formula.sh "${GITHUB_REF_NAME#v}" dist > dist/everett.rb
      - name: Sign release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Everett ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md

  verify-public:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from the public tag and exercise the downloaded binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) target=x86_64-unknown-linux-musl ;;
            macOS) target=aarch64-apple-darwin ;;
          esac
          archive="everett-$target.tar.gz"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "$base/$archive"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"
          curl -fsSLO --retry 3 "$base/$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/install.sh" -o install.sh
          EVERETT_VERSION="$GITHUB_REF_NAME" EVERETT_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          tar -xzf "$archive"
          export EVERETT_VERIFY_BINARY="$RUNNER_TEMP/bin/everett"
          cmp "$EVERETT_VERIFY_BINARY" "everett-$target/everett"
          "$EVERETT_VERIFY_BINARY" --version | tee version.txt
          grep -Fx "everett ${GITHUB_REF_NAME#v}" version.txt
          grep -Fx "revision: $GITHUB_SHA" version.txt
          grep -Fx "dirty: false" version.txt
          cd "$GITHUB_WORKSPACE/everett-rs"
          cargo test --locked --test release_journey
