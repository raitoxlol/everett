name: Release journey

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: everett-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Exercise the release binary over isolated stores
        env:
          EVERETT_VERIFY_BINARY: ${{ github.workspace }}/everett-rs/target/release/everett
        run: cargo test --locked --test release_journey
