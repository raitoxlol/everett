name: Docs site

on:
  push:
    branches: [main]
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'plugins/*/README.md', 'site/**', 'everett-rs/Cargo.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'plugins/*/README.md', 'site/**', 'everett-rs/Cargo.toml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-enabled.outputs.enabled }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Pages deployment is opt-in: the build and --strict link check always run,
      # but configure/upload/deploy only run when the repo actually has Pages enabled.
      - id: pages-enabled
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository; skipping deploy steps."
          fi
      - id: pages
        if: github.event_name != 'pull_request' && steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      # --strict fails the job on any unresolved link or anchor in README.md / docs/.
      - run: node build.mjs --strict
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - if: github.event_name != 'pull_request' && steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
