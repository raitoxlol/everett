[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "everett-sessions"
version = "1.4.0"
description = "One layer above all your coding-agent sessions: list, route, and deliver work across Claude Code, Codex, OMP, Pi, Hermes Agent, and Grok CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Everett contributors"}]
keywords = ["claude-code", "codex", "grok", "mcp", "agents", "sessions", "router", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = ["tomli>=2.0.1; python_version < '3.11'"]

[project.optional-dependencies]
gateway = ["mcp==1.26.0"]

[project.urls]
Homepage = "https://github.com/raitoxlol/everett"
Issues = "https://github.com/raitoxlol/everett/issues"
Changelog = "https://github.com/raitoxlol/everett/blob/main/CHANGELOG.md"

[project.scripts]
everett = "everett.cli:main"

[tool.setuptools]
packages = ["everett", "everett.adapters", "everett.hooks"]

[tool.setuptools.package-data]
"everett.hooks" = ["*.mjs"]
